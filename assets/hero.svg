<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="globeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="glowHero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="200" r="180" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 5" class="bg-ring" opacity="0.5"/>
  <circle cx="250" cy="200" r="220" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="10 10" class="bg-ring" opacity="0.3"/>

  <!-- Centered Globe -->
  <g transform="translate(250, 200)">
    <!-- Globe sphere -->
    <circle cx="0" cy="0" r="110" fill="url(#globeGrad)" stroke="#bae6fd" stroke-width="1.5" />
    
    <!-- Longitude/Latitude lines -->
    <!-- Latitudes -->
    <path d="M -110 0 A 110 30 0 0 0 110 0" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.6" />
    <path d="M -110 0 A 110 30 0 0 1 110 0" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.6" />
    <path d="M -95 -55 A 95 20 0 0 0 95 -55" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.4" />
    <path d="M -95 55 A 95 20 0 0 1 95 55" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.4" />
    <!-- Longitudes -->
    <path d="M 0 -110 A 30 110 0 0 0 0 110" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.6" />
    <path d="M 0 -110 A 30 110 0 0 1 0 110" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.6" />
    <path d="M 0 -110 A 80 110 0 0 0 0 110" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.4" />
    <path d="M 0 -110 A 80 110 0 0 1 0 110" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Network lines connecting students to the globe -->
  <g stroke-linecap="round">
    <!-- Main network nodes and connections -->
    <line x1="120" y1="120" x2="190" y2="150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="380" y1="120" x2="310" y2="150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="100" y1="260" x2="170" y2="230" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="390" y1="270" x2="320" y2="240" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="250" y1="60" x2="250" y2="90" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Cross-connections between students -->
    <path d="M 120 120 Q 250 30 380 120" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
    <path d="M 100 260 Q 250 370 390 270" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
    <path d="M 120 120 Q 70 190 100 260" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
    <path d="M 380 120 Q 430 195 390 270" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2" />
  </g>

  <!-- Connected Students / Node Avatars -->
  
  <!-- Student 1 (Top Left) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="0" cy="0" r="24" fill="url(#accentBlue)" />
    <!-- Stylized student icon (cap/head) -->
    <path d="M -10 -2 L 0 -8 L 10 -2 L 0 4 Z" fill="#ffffff" />
    <path d="M -6 1 C -6 6 6 6 6 1" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="-2" r="3" fill="#ffffff" />
    <path d="M 8 -2 L 8 4" stroke="#ffffff" stroke-width="1" />
    <circle cx="8" cy="4" r="1.5" fill="#ffffff" />
  </g>

  <!-- Student 2 (Top Right) -->
  <g transform="translate(380, 120)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#6d28d9" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="0" cy="0" r="24" fill="url(#accentViolet)" />
    <!-- Stylized user head + shoulders -->
    <circle cx="0" cy="-4" r="6" fill="#ffffff" />
    <path d="M -12 8 C -12 3 -6 2 0 2 C 6 2 12 3 12 8 Z" fill="#ffffff" />
  </g>

  <!-- Student 3 (Bottom Left) -->
  <g transform="translate(100, 260)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#2dd4bf" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="0" cy="0" r="24" fill="url(#accentTeal)" />
    <!-- Stylized coding student (brackets/head) -->
    <text x="0" y="4" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Student 4 (Bottom Right) -->
  <g transform="translate(390, 270)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="0" cy="0" r="24" fill="url(#accentBlue)" />
    <!-- Stylized globe/network gear -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="1.5" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Student 5 (Top Center) -->
  <g transform="translate(250, 60)">
    <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#a78bfa" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
    <circle cx="0" cy="0" r="20" fill="url(#accentViolet)" />
    <!-- Lightbulb/idea icon -->
    <path d="M -4 -6 C -6 -6 -6 -2 -4 0 L -3 3 L 3 3 L 4 0 C 6 -2 6 -6 4 -6 Z" fill="#ffffff" />
    <rect x="-3" y="4" width="6" height="2" fill="#ffffff" rx="0.5" />
  </g>

  <!-- Network dots on the globe -->
  <circle cx="210" cy="170" r="4.5" fill="#38bdf8" filter="url(#glowHero)" />
  <circle cx="290" cy="230" r="4.5" fill="#2dd4bf" filter="url(#glowHero)" />
  <circle cx="270" cy="140" r="4" fill="#a78bfa" filter="url(#glowHero)" />
  <circle cx="230" cy="220" r="4" fill="#38bdf8" />
  <circle cx="190" cy="210" r="3.5" fill="#0d9488" />
  
  <!-- Tiny floating connection paths/particles -->
  <circle cx="160" cy="90" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="340" cy="90" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="120" cy="200" r="3" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="370" cy="210" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="220" cy="100" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="280" r="2" fill="#0d9488" opacity="0.5"/>
</svg>
