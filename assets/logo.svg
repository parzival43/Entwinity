<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradients matching our blue/teal color scheme -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Entwined Rings / Nodes representing connection -->
  <g transform="translate(0, 0)">
    <!-- Main Connecting Paths -->
    <path d="M 50 25 C 65 25, 75 35, 75 50 C 75 65, 65 75, 50 75 C 35 75, 25 65, 25 50 C 25 35, 35 25, 50 25 Z" 
          fill="none" stroke="url(#blueGrad)" stroke-width="6" opacity="0.8" />
          
    <!-- Left Ring -->
    <circle cx="38" cy="50" r="16" fill="none" stroke="url(#tealGrad)" stroke-width="5" />
    
    <!-- Right Ring -->
    <circle cx="62" cy="50" r="16" fill="none" stroke="url(#indigoGrad)" stroke-width="5" />

    <!-- Connecting Nodes -->
    <circle cx="38" cy="50" r="4.5" fill="#14b8a6" filter="url(#glow)" />
    <circle cx="62" cy="50" r="4.5" fill="#6366f1" filter="url(#glow)" />
    <circle cx="50" cy="34" r="5" fill="#0ea5e9" filter="url(#glow)" />
    <circle cx="50" cy="66" r="5" fill="#0ea5e9" filter="url(#glow)" />

    <!-- Inner Core Dot -->
    <circle cx="50" cy="50" r="3" fill="#0d9488" />
  </g>
</svg>
